services:
  postgres:
    image: postgres:16-alpine
    container_name: ecom-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecom_password}
      POSTGRES_DB: ecom
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-databases.sql:/docker-entrypoint-initdb.d/init-multiple-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecom} -d ecom"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.7.2
    container_name: ecom-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - kafka-data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:3.7.2
    container_name: ecom-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic order.created --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic refund.requested --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic payment.updated --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: ecom-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ecom-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    restart: unless-stopped

  user:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: user
    container_name: ecom-user
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/userdb
      DB_USERNAME: ${POSTGRES_USER:-ecom}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ecom_password}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-of-at-least-32-chars}
      MAIL_ID: ${MAIL_ID:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    restart: unless-stopped

  product:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: product
    container_name: ecom-product
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/productdb
      DB_USERNAME: ${POSTGRES_USER:-ecom}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ecom_password}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-of-at-least-32-chars}
    restart: unless-stopped

  cart:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: cart
    container_name: ecom-cart
    depends_on:
      postgres:
        condition: service_healthy
      user:
        condition: service_started
      product:
        condition: service_started
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/cartdb
      DB_USERNAME: ${POSTGRES_USER:-ecom}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ecom_password}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-of-at-least-32-chars}
      USER_SERVICE_URL: http://user:8081
      PRODUCT_SERVICE_URL: http://product:8080
    restart: unless-stopped

  order:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: order
    container_name: ecom-order
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      user:
        condition: service_started
      product:
        condition: service_started
      cart:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/orderdb
      DB_USERNAME: ${POSTGRES_USER:-ecom}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ecom_password}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-of-at-least-32-chars}
      USER_SERVICE_URL: http://user:8081
      PRODUCT_SERVICE_URL: http://product:8080
      CART_SERVICE_URL: http://cart:8082
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    restart: unless-stopped

  payment:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE: payment
    container_name: ecom-payment
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      DB_URL: jdbc:postgresql://postgres:5432/paymentdb
      DB_USERNAME: ${POSTGRES_USER:-ecom}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ecom_password}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-of-at-least-32-chars}
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PAYMENT_SIMULATION_DELAY_MS: ${PAYMENT_SIMULATION_DELAY_MS:-5000}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecom-frontend
    depends_on:
      user:
        condition: service_started
      product:
        condition: service_started
      cart:
        condition: service_started
      order:
        condition: service_started
      payment:
        condition: service_started
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  postgres-data:
  kafka-data:
